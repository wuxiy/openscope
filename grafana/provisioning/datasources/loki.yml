# Loki datasource — fixed UID; Logs -> Trace internal link on trace_id derived field.
apiVersion: 1

datasources:
  - name: Loki
    uid: openscope-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: 'trace_id=([0-9a-f]{32})'
          datasourceUid: openscope-tempo