# OpenScope V0.1 Lok/Loki — TSDB schema v13, native OTLP ingestion at /otlp.
auth_enabled: false

server:
  http_listen_port: 3100

distributor:
  otlp_config:
    default_resource_attributes_as_index_labels:
      - site.id
      - project.id
      - deployment.environment.name
      - service.namespace
      - service.name

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-08-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: openscope_
        period: 24h

limits_config:
  allow_structured_metadata: true

storage_config:
  filesystem:
    directory: /loki/chunks