# OpenScope V0.1 Tempo — Tempo 3.x monolithic, local filesystem storage.
# NOTE: Tempo 3.x removed the top-level ingester/compactor keys from the config
# surface used here; storage is unified under storage.trace (local backend).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks